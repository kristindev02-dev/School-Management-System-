<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="sidebar">
        <h2 style="font-size: 1.5rem; font-weight: 750;">School System</h2>
        <nav>
            <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/students" class="nav-link {% if request.path == '/students' %}active{% endif %}">Students</a>
            <a href="/teachers" class="nav-link {% if request.path == '/teachers' %}active{% endif %}">Teachers</a>
            <a href="/courses" class="nav-link {% if request.path == '/courses' %}active{% endif %}">Courses</a>
            <a href="/enrollment" class="nav-link {% if request.path == '/enrollment' %}active{% endif %}">Enrollment</a>
        </nav>
    </div>

    <div class="main-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="container mt-3">
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('form.bulk-delete-form').forEach(function(form) {
                form.addEventListener('submit', function() {
                    const fieldName = form.dataset.fieldName;
                    if (!fieldName) return;

                    form.querySelectorAll('input[name="' + fieldName + '"]').forEach(function(input) {
                        input.remove();
                    });

                    const selected = Array.from(document.querySelectorAll('.rowCheckbox:checked')).map(function(cb) {
                        return cb.value;
                    });

                    selected.forEach(function(value) {
                        const hidden = document.createElement('input');
                        hidden.type = 'hidden';
                        hidden.name = fieldName;
                        hidden.value = value;
                        form.appendChild(hidden);
                    });
                });
            });

            const selectAll = document.querySelector('#selectAll');
            if (selectAll) {
                selectAll.addEventListener('change', function() {
                    document.querySelectorAll('.rowCheckbox').forEach(function(cb) {
                        cb.checked = selectAll.checked;
                    });
                });
            }

            document.querySelectorAll('.alert-dismissible').forEach(function(alertEl) {
                setTimeout(function() {
                    const alert = bootstrap.Alert.getOrCreateInstance(alertEl);
                    alert.close();
                }, 4000);
            });
        });
    </script>
</body>
</html>
