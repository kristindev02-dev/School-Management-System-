<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .js-toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1080;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-width: 360px;
        }

        .js-toast {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.75rem 0.95rem;
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
            color: #fff;
            font-size: 0.95rem;
            transform: translateY(-8px);
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .js-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .js-toast-success {
            background: #198754;
        }

        .js-toast-warning {
            background: #f59f00;
            color: #212529;
        }

        .js-toast-error {
            background: #dc3545;
        }

        .js-toast-info {
            background: #0d6efd;
        }

        .js-toast-close {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2 style="font-size: 1.5rem; font-weight: 750;">School System</h2>
        <nav>
            <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/students" class="nav-link {% if request.path == '/students' %}active{% endif %}">Students</a>
            <a href="/teachers" class="nav-link {% if request.path == '/teachers' %}active{% endif %}">Teachers</a>
            <a href="/courses" class="nav-link {% if request.path == '/courses' %}active{% endif %}">Courses</a>
            <a href="/enrollment"
                class="nav-link {% if request.path == '/enrollment' %}active{% endif %}">Enrollment</a>
        </nav>
    </div>

    <div class="main-content">
        <div id="jsToastContainer" class="js-toast-container" aria-live="polite" aria-atomic="true"></div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <script id="flashToastData" type="application/json">{{ messages|tojson }}</script>
        {% endif %}
        {% endwith %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // ==========================================================================
            // 1. BULK DELETE FORM SUBMISSION LOGIC
            // ==========================================================================
            document.querySelectorAll('form.bulk-delete-form').forEach(function (form) {
                form.addEventListener('submit', function () {
                    const fieldName = form.dataset.fieldName;
                    if (!fieldName) return;

                    form.querySelectorAll('input[name="' + fieldName + '"]').forEach(function (input) {
                        input.remove();
                    });

                    // Fallback selector: checks for '.row-checkbox', '.rowCheckbox', or any checkbox inside tbody
                    const selectedBoxes = document.querySelectorAll('.row-checkbox:checked, .rowCheckbox:checked, tbody input[type="checkbox"]:checked');
                    const selected = Array.from(selectedBoxes).map(function (cb) {
                        return cb.value;
                    });

                    selected.forEach(function (value) {
                        const hidden = document.createElement('input');
                        hidden.type = 'hidden';
                        hidden.name = fieldName;
                        hidden.value = value;
                        form.appendChild(hidden);
                    });
                });
            });

            // ==========================================================================
            // 2. DYNAMIC VISIBILITY & SELECT ALL LOGIC (FIXED)
            // ==========================================================================
            const selectAllBox = document.getElementById('selectAll');
            const deleteBtn = document.getElementById('deleteSelectedBtn') || document.querySelector('form.bulk-delete-form button[type="submit"]');

            // Helper function to safely find all row checkboxes regardless of class name mismatch
            function getRowCheckboxes() {
                const boxes = document.querySelectorAll('tbody input[type="checkbox"].rowCheckbox, tbody input[type="checkbox"].row-checkbox, tbody input[type="checkbox"], #selectAll');
                return Array.from(boxes);
            }

            // Function to show/hide delete button based on checkbox states
            function toggleDeleteButton() {
                if (!deleteBtn) return;

                const rowCheckboxes = getRowCheckboxes();
                const anyChecked = rowCheckboxes.some(cb => cb.checked);

                // Show button if any are checked, otherwise hide it
                deleteBtn.style.display = anyChecked ? 'inline-block' : 'none';
            }

            // Run visibility check on page load
            toggleDeleteButton();

            // "Select All" Master Checkbox Logic
            if (selectAllBox) {
                selectAllBox.addEventListener('change', function () {
                    const rowCheckboxes = getRowCheckboxes();
                    rowCheckboxes.forEach(cb => {
                        cb.checked = this.checked;
                    });
                    toggleDeleteButton();
                });
            }

            // Individual Row Checkbox Logic (Using Event Delegation so it always catches clicks)
            document.addEventListener('change', function (event) {
                const rowCheckboxes = getRowCheckboxes();

                // Check if the changed element is one of our row checkboxes
                if (rowCheckboxes.includes(event.target) && event.target !== selectAllBox) {
                    if (!selectAllBox) {
                        toggleDeleteButton();
                        return;
                    }

                    if (!event.target.checked) {
                        selectAllBox.checked = false;
                    } else {
                        const allChecked = rowCheckboxes.every(item => item.checked);
                        selectAllBox.checked = allChecked;
                    }
                    toggleDeleteButton();
                }
            });

            // ==========================================================================
            // 3. JAVASCRIPT TOAST NOTIFICATIONS LOGIC
            // ==========================================================================
            const toastContainer = document.getElementById('jsToastContainer');
            const toastDataScript = document.getElementById('flashToastData');

            function mapToastType(category) {
                const cat = String(category || 'info').toLowerCase();
                if (['danger', 'error', 'wrong', 'failure', 'failed'].includes(cat)) return 'error';
                if (['warning', 'warn'].includes(cat)) return 'warning';
                if (['success', 'ok'].includes(cat)) return 'success';
                return 'info';
            }

            function showJsToast(message, category) {
                if (!toastContainer || !message) return;

                const type = mapToastType(category);
                const toast = document.createElement('div');
                toast.className = 'js-toast js-toast-' + type;
                toast.setAttribute('role', 'status');

                const text = document.createElement('span');
                text.textContent = message;

                const closeBtn = document.createElement('button');
                closeBtn.className = 'js-toast-close';
                closeBtn.type = 'button';
                closeBtn.setAttribute('aria-label', 'Close');
                closeBtn.innerHTML = '&times;';

                closeBtn.addEventListener('click', function () {
                    toast.remove();
                });

                toast.appendChild(text);
                toast.appendChild(closeBtn);
                toastContainer.appendChild(toast);

                requestAnimationFrame(function () {
                    toast.classList.add('show');
                });

                setTimeout(function () {
                    toast.classList.remove('show');
                    setTimeout(function () {
                        if (toast.parentNode) toast.remove();
                    }, 250);
                }, 3500);
            }

            if (toastDataScript) {
                try {
                    const flashMessages = JSON.parse(toastDataScript.textContent || '[]');
                    flashMessages.forEach(function (item) {
                        showJsToast(item[1], item[0]);
                    });
                } catch (err) {
                    console.error('Failed to parse flash toast data:', err);
                }
            }

                // ======================================================================
                // 4. DELETE CONFIRMATION MODAL
                // ======================================================================
                let deleteFormToSubmit = null;
                const confirmDeleteModalEl = document.getElementById('confirmDeleteModal');
                const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
                const confirmDeleteModalBody = document.getElementById('confirmDeleteModalBody');
                const deleteModal = confirmDeleteModalEl ? new bootstrap.Modal(confirmDeleteModalEl) : null;

                document.querySelectorAll('form.row-delete-form').forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        event.preventDefault();
                        deleteFormToSubmit = form;
                        const itemName = form.dataset.itemName || '';
                        confirmDeleteModalBody.innerHTML = '';
                        if (itemName) {
                            confirmDeleteModalBody.appendChild(document.createTextNode('Are you sure you want to delete '));
                            const strong = document.createElement('strong');
                            strong.textContent = itemName;
                            confirmDeleteModalBody.appendChild(strong);
                            confirmDeleteModalBody.appendChild(document.createTextNode('?'));
                        } else {
                            confirmDeleteModalBody.textContent = 'Are you sure you want to delete this item?';
                        }
                        if (deleteModal) {
                            deleteModal.show();
                        }
                    });
                });

                if (confirmDeleteBtn) {
                    confirmDeleteBtn.addEventListener('click', function () {
                        if (deleteFormToSubmit) {
                            deleteFormToSubmit.submit();
                        }
                    });
                }
            });
        </script>

        <div class="modal fade" id="confirmDeleteModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Confirm Delete</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="confirmDeleteModalBody">
                        Are you sure you want to delete this item?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Yes, delete</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
